name: best_msc_collect
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12

  # Web framework
  - fastapi=0.115.0
  - uvicorn=0.30.6

  # HTTP client
  - httpx=0.27.2

  # HTML parsing
  - lxml=6.1.0
  - parsel=1.9.1

  # Data validation and settings
  - pydantic=2.9.2
  - pydantic-settings=2.5.2

  # Utilities
  - tenacity=9.0.0
  - python-multipart=0.0.27

  # Task progress storage (optional, in-memory if not used)
  - redis-py=5.0.8

  # Testing
  - pytest=9.0.3
  - pytest-asyncio=1.3.0